[project]
name = "khidki"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "RaYYeR220", email = "egorslavutich@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi>=0.162.2",
    "google-adk[db]>=2.14.0",
    "httpx>=0.28.1",
    "lightgbm>=4.7.0",
    "litellm>=1.97.0",
    "mcp>=2.3.0",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "pydantic>=2.14.3",
    "python-dateutil>=4.0.0",
    "scikit-learn>=1.9.1",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.11.23,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "respx>=0.23.1",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
